name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: goldb2b_test
          MYSQL_USER: goldb2b
          MYSQL_PASSWORD: goldb2b
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # bcmath is mandatory: every financial calculation depends on it.
          extensions: bcmath, intl, pdo_mysql, redis, mbstring, zip
          coverage: xdebug

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist

      - name: Architecture rules
        # Module boundaries, no-float-in-financial-code, strict_types,
        # append-only ledger. A failure here is an architecture regression.
        run: vendor/bin/phpunit --testsuite Architecture

      - name: Code style
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Migrations
        run: php artisan migrate:fresh --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: goldb2b_test
          DB_USERNAME: goldb2b
          DB_PASSWORD: goldb2b

      - name: Test suite
        run: vendor/bin/phpunit
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: goldb2b_test
          DB_USERNAME: goldb2b
          DB_PASSWORD: goldb2b
          REDIS_HOST: 127.0.0.1

      - name: Ledger invariants
        # These prove gold is never created or destroyed. Non-negotiable.
        run: vendor/bin/phpunit --group ledger-invariants
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: goldb2b_test
          DB_USERNAME: goldb2b
          DB_PASSWORD: goldb2b

      - name: Dependency audit
        run: composer audit --no-interaction
        continue-on-error: true

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: mobile
        run: flutter test
