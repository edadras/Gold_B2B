          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    parameters:
      -
        name: webhook
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'A UUID minted by the client when the intent is formed, not when the request is sent. Reuse the same key on every retry of the same intent.'
    TransactionSignature:
      name: X-Transaction-Signature
      in: header
      required: true
      schema:
        type: string
      description: 'Current TOTP code. Verified before the idempotency key is recorded.'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: 'Opaque cursor from the previous response. Cursor paging is stable against concurrent inserts; offset paging is not.'
  schemas:
    Envelope:
      type: object
      properties:
        data:
          description: 'Resource or collection'
        meta:
          $ref: '#/components/schemas/Meta'
        links:
          type: object
          nullable: true
      required:
        - data
        - meta
    Meta:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        server_time:
          type: string
          format: date-time
        count:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: INSUFFICIENT_GOLD
            message:
              type: string
              description: 'Persian, safe to show a user'
            details:
              type: object
              nullable: true
            field_errors:
              type: object
              nullable: true
          required:
            - code
            - message
        meta:
          $ref: '#/components/schemas/Meta'
    FineWeight:
      type: integer
      format: int64
      description: 'Milligrams of pure gold. 248750 is 248.750 g fine.'
      example: 248750
    Rial:
      type: integer
      format: int64
      description: 'Whole rial. Never a decimal.'
      example: 19521900000
    Purity:
      type: integer
      minimum: 0
      maximum: 10000
      description: 'Ten-thousandths. Market purity 995 is 9950.'
      example: 9950
  responses:
    DomainError:
      description: 'A business rule refused the request'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 'Missing or expired token'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Authenticated but not permitted, or the resource belongs to another organization'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 'Too many requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyConflict:
      description: 'An identical request is still in flight, or the key was reused with a different body'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
