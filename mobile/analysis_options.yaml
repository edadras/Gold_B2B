include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # `implicit-casts: false` is the pre-Dart-3 spelling of this; the modern
    # equivalents are the three strict-* flags below. All three are on.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Anything that can silently produce a wrong number is an error, not a hint.
    argument_type_not_assignable: error
    invalid_assignment: error
    return_of_invalid_type: error
    unchecked_use_of_nullable_value: error
    missing_return: error
    dead_code: warning
    # Warnings rather than errors: an unused import must not stop a build
    # while a feature is half-wired.
    unused_import: warning
    unused_local_variable: warning
    todo: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # --- correctness -------------------------------------------------------
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - collection_methods_unrelated_type
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks
    - use_build_context_synchronously

    # --- immutability ------------------------------------------------------
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_final_fields
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - avoid_setters_without_getters

    # --- money / weight safety --------------------------------------------
    #
    # There is no lint that can say "no double in a financial path", so the
    # rule is enforced two ways:
    #   1. the type system — FineWeight, Weight, Rial, PricePerFineGram and
    #      Purity all wrap `int` and expose no double-valued arithmetic;
    #   2. tool/no_double_in_money.sh, which fails CI if the token `double`
    #      appears anywhere under lib/shared/models/ or lib/features/*/data/.
    #
    # The single sanctioned exception is Rial.displayCompact, which divides by
    # 1e9 purely to render "۹۷.۹۱ میلیارد". It is annotated at the call site.
    - avoid_double_and_int_checks
    - prefer_int_literals

    # --- style -------------------------------------------------------------
    - always_use_package_imports
    - directives_ordering
    - omit_local_variable_types
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_named_constants
    - use_super_parameters
